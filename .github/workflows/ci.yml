name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag_learning_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.21

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rag:rag_learning_password@localhost:5432/rag_test
        run: uv run pytest -q

      - name: Compile Python files
        run: uv run python -m compileall -q app scripts tests

      - name: Check frontend JavaScript
        run: node --check app/static/app.js

      - name: Validate Docker build
        run: docker build --tag rag-learning-ci .
