name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.21

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Compile Python files
        run: uv run python -m compileall -q app scripts tests

      - name: Check frontend JavaScript
        run: node --check app/static/app.js

      - name: Validate Docker build
        run: docker build --tag rag-learning-ci .
