services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # 使用容器内绝对路径，避免工作目录变化导致 SQLite 或 Chroma 写到错误位置。
      DATA_DIR: /app/data
    ports:
      - "${RAG_PORT:-8000}:8000"
    volumes:
      # 宿主机 data 目录保存 SQLite、Chroma、上传文件和 MinerU 输出。
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
